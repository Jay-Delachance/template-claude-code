name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  preflight:
    name: Vérification du projet
    runs-on: ubuntu-latest
    outputs:
      has_package: ${{ steps.check.outputs.has_package }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "Aucun package.json — jobs npm ignorés"
          fi

  quality:
    name: Typecheck · Lint · Tests · Secrets
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_package == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Format
        run: npx prettier --check src/

      - name: Tests
        run: npm test

      - name: Secrets scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          gitleaks detect --source . --no-git

  security:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_package == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    needs: [preflight, quality]
    if: needs.preflight.outputs.has_package == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E
        run: npx playwright test
