name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  preflight:
    name: Vérification du projet
    runs-on: ubuntu-latest
    outputs:
      has_package: ${{ steps.check.outputs.has_package }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "Aucun package.json — jobs npm ignorés"
          fi

  quality:
    name: Typecheck · Lint · Tests · Secrets
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_package == 'true'
    # NOTE: `npm test` (Vitest) requires a Supabase project reachable from CI.
    # Point these secrets at a DEDICATED CI Supabase project — NOT the dev
    # project — because `npm run db:reset` recreates the public schema and
    # would wipe all dev data.
    # Required secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
    #                   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ACCESS_TOKEN
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Secrets scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          gitleaks detect --source . --no-git

  security:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_package == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  # NOTE: Tests E2E Playwright (npm run test:e2e)
  # Ce job est documenté ici mais désactivé par défaut (if: false) pour les
  # raisons suivantes :
  #   1. Il nécessite un runner capable d'exécuter des navigateurs
  #      (ubuntu-latest convient, mais les deps système doivent être
  #      installées via `npx playwright install --with-deps`).
  #   2. Il nécessite que l'application Next.js soit démarrée (webServer
  #      dans playwright.config.ts le gère, mais requiert `npm run dev` et
  #      les mêmes secrets Supabase que le job quality, pointant vers le
  #      projet CI dédié).
  #   3. `npm run db:reset` DOIT être exécuté avant les tests E2E pour
  #      garantir un état de base propre.
  # Pour activer : remplacer `if: false` par la condition souhaitée
  # (ex. `if: github.ref == 'refs/heads/main'`).
  e2e:
    name: Tests E2E Playwright (optionnel — désactivé sans navigateur)
    runs-on: ubuntu-latest
    needs: [preflight, quality]
    if: false  # Activer uniquement sur un runner avec navigateur + projet CI dédié
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Reset DB (projet CI dédié requis)
        run: npm run db:reset

      - name: E2E
        run: npm run test:e2e
